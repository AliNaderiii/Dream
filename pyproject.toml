[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-assistant"
version = "0.1.0"
description = "A personal AI assistant with first-class Persian language support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Naderi" }]
keywords = ["assistant", "memory", "persian", "farsi", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Natural Language :: Persian",
]
dependencies = []

[project.scripts]
dream = "cli:main"
dream-telegram = "dream.telegram:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/AliNaderiii/Dream"
Repository = "https://github.com/AliNaderiii/Dream"
Issues = "https://github.com/AliNaderiii/Dream/issues"

[tool.setuptools]
py-modules = ["cli", "doctor"]

[tool.setuptools.packages.find]
include = ["dream*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Runnable as ``python tools/memory_probe.py``: the repository root must be
# put on sys.path before Dream can be imported, so imports cannot all sit at
# the top of the file.
"tools/memory_probe.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
