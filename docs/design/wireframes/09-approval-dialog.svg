.0" y="494" width="94.0" height="28" rx="6" fill="#F7F9FA" stroke="#94A0AD" stroke-width="1.2"/><text x="511.0" y="512" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#46525E" font-weight="400" text-anchor="middle">Deny (Esc)</text><rect x="574.0" y="494" width="121.2" height="28" rx="6" fill="#DDE4EA" stroke="#94A0AD" stroke-width="1.6"/><text x="634.6" y="512" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#46525E" font-weight="600" text-anchor="middle">Allow once (⏎)</text><rect x="724.0" y="494" width="209.6" height="28" rx="6" fill="#F7F9FA" stroke="#94A0AD" stroke-width="1.2"/><text x="828.8" y="512" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#46525E" font-weight="400" text-anchor="middle">Always allow for this tool…</text><text x="464.0" y="538" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#6B7BD6" font-weight="400" text-anchor="start" font-style="italic">▸ “Always allow” opens scope note + adds to Permissions audit list (revocable)</text><text x="300" y="580" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#6B7BD6" font-weight="400" text-anchor="start" font-style="italic">▸ motion: sheet slides up 260ms ease-enter; focus trapped; role=alertdialog; announced to screen readers</text><rect x="300" y="678" width="868" height="64" rx="10" fill="#FFFFFF" stroke="#94A0AD" stroke-width="1.4"/><text x="312" y="702" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94A0AD" font-weight="400" text-anchor="start">Message Dream…  ( / commands · @ files · ⏎ send · ⇧⏎ newline )</text><rect x="1126" y="694" width="32" height="32" rx="8" fill="#DDE4EA" stroke="#94A0AD" stroke-width="1.2"/><text x="1142" y="714" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#46525E" font-weight="400" text-anchor="middle">➤</text><rect x="312" y="716" width="90" height="20" rx="10" fill="#E9EDF1" stroke="#94A0AD" stroke-width="1.2"/><text x="357.0" y="730" font-family="Inter,sy