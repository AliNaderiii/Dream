name: Desktop CI

# Builds and checks the Tauri desktop shell on macOS, Windows and Linux.
# The Python package has its own workflow (ci.yml) and is untouched here.

on:
  push:
    branches: [main, "arena/**", "feat/**", "release/**"]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/desktop

jobs:
  # Fast feedback: types, lint, formatting and unit tests. No Rust toolchain needed.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build performance bundle
        run: npm run build

      - name: Performance budgets
        run: npm run performance:check

      - name: Accessibility and reduced-motion gates
        run: npm run accessibility:check

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-performance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: apps/desktop/performance-results.json

  # G1 + G9: the Rust side must compile and pass clippy/fmt on all three OS.
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tauri build` needs a frontend bundle to embed; build it once up front.
      - name: Build frontend
        run: npm run build

      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo build
        working-directory: apps/desktop/src-tauri
        run: cargo build --verbose

      # `cargo test` is skipped on Windows: tauri-winres only embeds the Windows
      # app manifest into the main binary, so test EXEs load ComCtl32 v5 instead
      # of v6 and fail to start with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
      # See https://github.com/tauri-apps/tauri/issues/13419
      # The tests are platform-agnostic logic and are covered by the Linux/macOS jobs.
      - name: Cargo test
        if: runner.os != 'Windows'
        working-directory: apps/desktop/src-tauri
        run: cargo test --verbose
