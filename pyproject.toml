[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-assistant"
version = "0.4.6"
description = "A personal AI assistant with first-class Persian language support."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Naderi" }]
keywords = ["assistant", "memory", "persian", "farsi", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Natural Language :: Persian",
]
dependencies = [
    "keyring>=25.0",
    "Authlib>=1.3",
    "tzdata>=2024.1",
]

[project.scripts]
dream = "cli:main"
dream-bridge = "dream.bridge.server:run_stdio"
dream-telegram = "dream.telegram:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
data = ["nbformat>=5.9"]

[project.urls]
Homepage = "https://github.com/AliNaderiii/Dream"
Repository = "https://github.com/AliNaderiii/Dream"
Issues = "https://github.com/AliNaderiii/Dream/issues"

[tool.setuptools]
py-modules = ["cli", "doctor", "dream_serve"]

[tool.setuptools.packages.find]
include = ["dream*"]

[tool.ruff]
exclude = ["docs"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Runnable as ``python tools/memory_probe.py``: the repository root must be
# put on sys.path before Dream can be imported, so imports cannot all sit at
# the top of the file.
"tools/memory_probe.py" = ["E402"]
"tools/runtime_probe.py" = ["E402"]
"tools/sec_agentic_probe.py" = ["E402"]
"examples/runtime_demo.py" = ["E402"]
"tools/soak_test.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # Python 3.12+ deprecates asyncio.get_event_loop() without a running
    # loop; the scheduler/subagent call sites are loop-bound at runtime but
    # CI interpreters emit the warning during teardown paths.
    "ignore:There is no current event loop:DeprecationWarning",
    "ignore::DeprecationWarning:asyncio",
    "ignore::pytest.PytestDeprecationWarning",
]
