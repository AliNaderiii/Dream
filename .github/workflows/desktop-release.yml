name: Desktop Release

# Builds installers for Linux and Windows. 
# macOS builds are intentionally excluded — they require Apple Developer ID
# ($99/year) plus a Tauri-side signing config (release.apple.conf.json).
# To enable: uncomment the macOS entry below and add the Apple secrets.
#
# Signing is secret-gated: missing secrets → unsigned artifacts (PRs/forks stay green).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a draft GitHub release'
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (deb/rpm/AppImage)
            target: x86_64-unknown-linux-gnu
            args: ''
          - os: windows-latest
            label: Windows (NSIS)
            target: x86_64-pc-windows-msvc
            args: ''

          # To enable macOS build, uncomment and add Apple secrets:
          # - os: macos-latest
          #   label: macOS (universal, signed)
          #   target: universal-apple-darwin
          #   args: '--target universal-apple-darwin --config src-tauri/release.apple.conf.json'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            rpm

      # FIX (vs. original): removed redundant `targets:` here — the
      # universal-apple-darwin rustup target doesn't exist. Universal macOS
      # builds work because rsdylappleuniversal… → cross-compiled by rust
      # with the build script set up by tauri; we don't need rust-toolchain
      # to install any cross target explicitly.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Detect signing material
        id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          echo "windows=${{ env.WINDOWS_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"
          echo "updater=${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # FIX (vs. original): {{ github.token }} (the default workflow
          # GitHub token). ${{ secrets.GITHUB_TOKEN }} does NOT exist by default
          # in GitHub Actions and was causing the release step to fail at
          # release-asset upload with: "GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Dream ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.updater == 'true' }}
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dream-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig

  # Optional: publishes a Draft GitHub Release from workflow_dispatch
  # rather than a tag push. Tag pushes go straight to attach via
  # tauri-action's releaseDraft: true above.
  release-dispatch:
    name: Publish GitHub release
    needs: build
    if: ${{ inputs.publish == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Checksums
        run: |
          cd bundles
          find . -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.app.tar.gz' \) -exec sha256sum {} \; > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dream ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.AppImage
            bundles/**/*-setup.exe
            bundles/SHA256SUMS.txt