name: Desktop Release

# Builds installers for Linux and Windows and, on `v*` tag pushes, publishes
# them as assets of a public (non-draft) GitHub Release for that tag.
#
# Honesty notes baked into the flow:
# - Windows NSIS installers are UNSIGNED unless the owner adds Authenticode
#   secrets (WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD). Unsigned is
#   the expected, supported path — SmartScreen will warn on first run.
# - Updater signatures are optional: when TAURI_SIGNING_PRIVATE_KEY is absent
#   the job still succeeds and simply skips updater artifacts.
# - The installer ships the UI shell only; the Python kernel must be installed
#   separately (Python 3.10+ with `pip install -e .` from the repository).
#
# macOS is intentionally excluded — it requires an Apple Developer ID
# ($99/year) plus a Tauri-side signing config (release.apple.conf.json). To
# enable macOS, add Apple signing secrets (APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
# APPLE_TEAM_ID) and uncomment the macOS matrix entry.
#
# workflow_dispatch builds installers and uploads them as CI artifacts only;
# it never touches GitHub Releases (there is no tag to attach them to).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (deb/rpm/AppImage)
            target: x86_64-unknown-linux-gnu
            args: ''

          - os: windows-latest
            label: Windows (NSIS)
            target: x86_64-pc-windows-msvc
            args: ''

          # To re-enable macOS, uncomment below AND provide Apple signing secrets.
          #
          # - os: macos-latest
          #   label: macOS (universal, signed)
          #   target: universal-apple-darwin
          #   args: '--target universal-apple-darwin --config src-tauri/release.apple.conf.json'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Detect signing material
        id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "windows=${{ env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"
          echo "updater=${{ env.TAURI_SIGNING_PRIVATE_KEY != '' && env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish stale draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx 'true'; then
            gh release edit "$tag" --draft=false
            echo "Published previously-draft release for $tag"
          else
            echo "No draft release for $tag (or no release yet) — nothing to publish"
          fi

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Dream ${{ github.ref_name }}'
          releaseBody: |
            Dream desktop ${{ github.ref_name }}, built from main.

            **Windows (`-setup.exe`)** and Linux installers are attached below.

            - The installer is the UI shell only: it does **not** bundle Python.
              Install Python 3.10+ and Dream first (`pip install -e .` from the
              repository root), then launch the app.
            - The Windows installer is **unsigned** — SmartScreen may warn. That
              is expected.
            - WebView2 may be downloaded during installation if it is missing.
            - First-run path without an installer: clone the repository, install
              Ollama, double-click `run.bat` (see `docs/user/quick-start.md`).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.updater == 'true' }}
          args: ${{ matrix.args }}

      - name: Build installers (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Verify Windows NSIS installer was produced
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup) {
            throw "NSIS bundle missing: expected a *-setup.exe under target/release/bundle/nsis"
          }
          Write-Host "NSIS installer: $($setup.FullName)"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dream-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig

      - name: Verify release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets="$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "Assets attached to $tag: $assets"
          case "${{ matrix.target }}" in
            *windows*)
              if ! echo "$assets" | grep -q -- '-setup.exe'; then
                echo "::error::Release $tag has no Windows NSIS installer attached"
                exit 1
              fi
              ;;
            *linux*)
              if ! echo "$assets" | grep -qE '\.(deb|rpm|AppImage)'; then
                echo "::error::Release $tag has no Linux installer attached"
                exit 1
              fi
              ;;
          esac
