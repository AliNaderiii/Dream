name: Desktop Release

# Builds installers for macOS, Windows and Linux.
#
# Signing is secret-gated: when the relevant secrets are absent the corresponding
# OS is silently dropped from the matrix. PRs and forks stay green by default.
# On a release tag with secrets configured the same workflow emits signed builds
# for every supported OS.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a draft GitHub release'
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        # Linux & Windows are always included. macOS is only included when
        # all Apple signing material is configured in repo secrets.
        include:
          - os: ubuntu-22.04
            label: Linux (deb/rpm/AppImage)
            target: x86_64-unknown-linux-gnu
            args: ''
            apple: 'false'
          - os: windows-latest
            label: Windows (NSIS)
            target: x86_64-pc-windows-msvc
            args: ''
            apple: 'false'
          - os: macos-latest
            label: macOS (universal, signed)
            target: universal-apple-darwin
            args: '--target universal-apple-darwin --config src-tauri/release.apple.conf.json'
            apple: 'true'
          - os: macos-latest
            label: macOS (universal, unsigned)
            target: universal-apple-darwin
            args: '--target universal-apple-darwin'
            apple: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      # Per-OS signer setup. Apple signing is gated by the apple input; the
      # unsigned-macOS row simply skips all signing material.
      - name: Resolve signing material
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          echo "apple=${{ matrix.apple && env.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"
          echo "windows=${{ env.WINDOWS_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"
          echo "updater=${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"

      # Ensure both Apple-configurable matrix entries actually run only when
      # the corresponding secret is present. The unsigned-macOS row stays
      # even when no Apple cert is available.
      - name: Filter Apple signers without secrets
        if: matrix.apple == 'true'
        run: |
          if [ "$APPLE_CERTIFICATE" = "" ]; then
            echo "::error::APPLE_CERTIFICATE required for signed macOS build"
            exit 1
          fi

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Explicit GITHUB_TOKEN is required for tauri-action to attach assets;
          # the default ${{ github.token }} is normally sufficient but pinning
          # the env name works across runner images.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifacts are only produced when an updater key is available:  
          # tauri fails the build if `createUpdaterArtifacts` is on without a key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing / notarization (Developer ID). Only loaded when the
          # matrix entry's apple flag is true.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Dream ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.updater == 'true' }}
          args: >-
            ${{ matrix.args }}
            ${{ steps.signing.outputs.updater == 'true' && '--config src-tauri/tauri.release.conf.json' || '' }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dream-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig

  # Optional: rebuild a published release if the workflow was invoked by
  # `workflow_dispatch` rather than a tag push.
  release-dispatch:
    name: Publish GitHub release
    needs: build
    if: ${{ inputs.publish == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Checksums
        run: |
          cd bundles
          find . -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.app.tar.gz' \) -exec sha256sum {} \; > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dream ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            bundles/**/*.dmg
            bundles/**/*.app.tar.gz
            bundles/**/*.deb
            bundles/**/*.rpm
            bundles/**/*.AppImage
            bundles/**/*-setup.exe
            bundles/SHA256SUMS.txt