nter,system-ui,sans-serif" font-size="11.5" fill="#46525E" font-weight="400" text-anchor="middle">Back</text><rect x="1060" y="448" width="80.4" height="28" rx="6" fill="#DDE4EA" stroke="#94A0AD" stroke-width="1.6"/><text x="1100.2" y="466" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#46525E" font-weight="600" text-anchor="middle">Finish ✓</text><text x="30" y="540" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#6B7BD6" font-weight="400" text-anchor="start" font-style="italic">▸ every step skippable; skipping provider = offline echo + dismissible banner linking to Settings → Providers</text><text x="30" y="560" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#6B7BD6" font-weight="400" text-anchor="start" font-style="italic">▸ step transition: slide 320ms ease-standard (mirrored in RTL); reduced-motion: crossfade 0ms</text><text x="30" y="610" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#46525E" font-weight="700" text-anchor="start">Post-onboarding empty conversation:</text><rect x="30" y="620" width="740" height="120" rx="10" fill="#F7F9FA" stroke="#94A0AD" stroke-width="1.2"/><text x="50" y="648" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#46525E" font-weight="400" text-anchor="start">“Ask me anything — I remember what matters.”</text><rect x="50" y="668" width="180" height="20" rx="10" fill="#E9EDF1" stroke="#94A0AD" stroke-width="1.2"/><text x="140.0" y="682" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#46525E" font-weight="400" text-anchor="middle">Summarise a CSV →</text><rect x="250" y="668" width="180" height="20" rx="10" fill="#E9EDF1" stroke="#94A0AD" stroke-width="1.2"/><text x="340.0" y="682" font-family="Inter,system-ui,sans-serif" font-size="10.5" fill="#46525E" font-weight="400" text-anchor="middle">یادآوری تمدید بیمه →</text><rect x="450" y="668" width="180" height="20" rx="10" fill="#E9EDF1" stroke="#94A0AD" stroke-width="1.2"/><text x="540.