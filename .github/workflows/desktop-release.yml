name: Desktop Release

# Builds installers for Linux and Windows and, on `v*` tag pushes, publishes
# them as assets of a public (non-draft) GitHub Release for that tag.
#
# Honesty notes baked into the flow:
# - Windows NSIS installers are UNSIGNED unless the owner adds Authenticode
#   secrets (WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD). Unsigned is
#   the expected, supported path — SmartScreen will warn on first run.
# - Updater signatures are optional: when TAURI_SIGNING_PRIVATE_KEY is absent
#   the job still succeeds and simply skips updater artifacts.
# - Windows NSIS runs `scripts/bundle-sidecar.mjs` at `tauri build` time and
#   embeds CPython 3.12.10 plus a non-editable Dream install, so a Release
#   download can start the sidecar with no local Python.
# - Tag builds ALSO produce a *full* Windows installer
#   (`Dream_<version>_full_x64-setup.exe`): the same app plus the `stt` extra
#   (faster-whisper) and the pinned Whisper `base` model next to the sidecar,
#   for fully-offline real speech-to-text. The full artifact is built BEFORE
#   the release is created, so a failed full build never publishes a partial
#   release. `workflow_dispatch` can opt in with the `build_full` input.
# - Linux artefacts are the UI shell only; the sidecar uses system Python
#   3.10+ with Dream installed (`pip install -e .` from the repository).
#
# macOS is intentionally excluded — it requires an Apple Developer ID
# ($99/year) plus a Tauri-side signing config (release.apple.conf.json). To
# enable macOS, add Apple signing secrets (APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
# APPLE_TEAM_ID) and uncomment the macOS matrix entry.
#
# workflow_dispatch builds installers and uploads them as CI artifacts only;
# it never touches GitHub Releases (there is no tag to attach them to).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_full:
        description: 'Also build the full Windows installer (offline STT + Whisper model)'
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (deb/rpm/AppImage)
            target: x86_64-unknown-linux-gnu
            args: ''

          - os: windows-latest
            label: Windows (NSIS)
            target: x86_64-pc-windows-msvc
            args: ''

          # To re-enable macOS, uncomment below AND provide Apple signing secrets.
          #
          # - os: macos-latest
          #   label: macOS (universal, signed)
          #   target: universal-apple-darwin
          #   args: '--target universal-apple-darwin --config src-tauri/release.apple.conf.json'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Detect signing material
        id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "windows=${{ env.WINDOWS_CERTIFICATE != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"
          echo "updater=${{ env.TAURI_SIGNING_PRIVATE_KEY != '' && env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish stale draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx 'true'; then
            gh release edit "$tag" --draft=false
            echo "Published previously-draft release for $tag"
          else
            echo "No draft release for $tag (or no release yet) — nothing to publish"
          fi

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(python -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${app_version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches app version ${app_version}"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body=$(awk -v ver="$version" '
            BEGIN { state = "search" }
            state == "search" && index($0, "## [" ver "]") == 1 { state = "copy"; next }
            state == "copy" && /^## \[/ { state = "done" }
            state == "copy" { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            echo "No CHANGELOG.md section for ${GITHUB_REF_NAME} - falling back to the one-liner body."
            body="Dream desktop ${GITHUB_REF_NAME}, built from main."
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$body"
            echo ""
            echo "---"
            echo ""
            echo "**Installer notes**"
            echo ""
            echo '- **Windows (`-setup.exe`)** embeds a CPython 3.12 runtime plus the Dream kernel — no separate `pip install` and no local Python are required on Windows. Linux installers are the UI shell and still need system Python 3.10+ with Dream installed (`pip install -e .` from the repository).'
            echo '- The Windows installer is **unsigned** — SmartScreen may warn. Choose More info → Run anyway. That is expected.'
            echo '- WebView2 may be downloaded during installation if it is missing.'
            echo '- Ollama is optional for a real local model; without it the router may fall through to echo.'
            echo '- **Two Windows installers:** the standard `-setup.exe` stays lean (voice notes use the built-in, clearly-labelled engine); `*_full_x64-setup.exe` additionally bundles faster-whisper and the `base` Whisper model for fully-offline real speech-to-text. Other model sizes (`DREAM_WHISPER_MODEL`) download on first use when online.'
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Bundle full sidecar (STT extra + Whisper model)
        if: startsWith(matrix.os, 'windows') && (startsWith(github.ref, 'refs/tags/') || inputs.build_full == true)
        working-directory: apps/desktop
        run: node ./scripts/bundle-sidecar.mjs --full

      - name: Build full NSIS installer
        if: startsWith(matrix.os, 'windows') && (startsWith(github.ref, 'refs/tags/') || inputs.build_full == true)
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      - name: Stage full installer
        if: startsWith(matrix.os, 'windows') && (startsWith(github.ref, 'refs/tags/') || inputs.build_full == true)
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) {
            throw "Full build produced no NSIS installer under target/release/bundle/nsis"
          }
          Copy-Item $setup.FullName "${env:RUNNER_TEMP}/dream-full-setup.exe" -Force
          $mb = [math]::Round((Get-Item "${env:RUNNER_TEMP}/dream-full-setup.exe").Length / 1MB, 1)
          Write-Host "Staged full installer: $($setup.FullName) ($mb MB)"

      - name: Reset sidecar to the lean bundle
        if: startsWith(matrix.os, 'windows') && (startsWith(github.ref, 'refs/tags/') || inputs.build_full == true)
        shell: pwsh
        run: |
          if (Test-Path "apps/desktop/src-tauri/resources/python") {
            Remove-Item -Recurse -Force "apps/desktop/src-tauri/resources/python"
            Write-Host "Removed full sidecar — the release build re-bundles the lean one"
          }

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Dream ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.updater == 'true' }}
          args: ${{ matrix.args }}

      - name: Build installers (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Verify Windows NSIS installer was produced
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup) {
            throw "NSIS bundle missing: expected a *-setup.exe under target/release/bundle/nsis"
          }
          Write-Host "NSIS installer: $($setup.FullName)"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dream-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/dream-full-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.rpm
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig

      - name: Attach SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          python - <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path("apps/desktop/src-tauri/target")
          if not root.exists():
              print("No target directory — nothing to checksum")
              sys.exit(0)
          names = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              name = path.name
              if name.endswith("-setup.exe") or path.suffix in {
                  ".deb",
                  ".rpm",
                  ".AppImage",
                  ".dmg",
              }:
                  names.append(path)
          if not names:
              print("No artefacts to checksum on this runner")
              sys.exit(0)
          lines = []
          for path in names:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              line = f"{digest}  {path.name}"
              lines.append(line)
              print(line)
          pathlib.Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          if [ -f SHA256SUMS.txt ]; then
            dest="SHA256SUMS-${{ matrix.target }}.txt"
            mv SHA256SUMS.txt "$dest"
            gh release upload "$tag" "$dest" --clobber
          fi

      - name: Attach full installer and checksums
        if: startsWith(github.ref, 'refs/tags/') && startsWith(matrix.os, 'windows')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          full="${RUNNER_TEMP}/dream-full-setup.exe"
          if [ ! -f "$full" ]; then
            echo "::error::Full installer missing at $full — the full build steps failed or were skipped on a tag run"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          dest="Dream_${version}_full_x64-setup.exe"
          cp "$full" "$dest"
          sums="SHA256SUMS-${{ matrix.target }}.txt"
          {
            (cd apps/desktop/src-tauri/target/release/bundle/nsis && sha256sum *-setup.exe)
            sha256sum "$dest"
          } > "$sums"
          gh release upload "$tag" "$dest" "$sums" --clobber
          echo "Attached $dest and refreshed $sums"

      - name: Verify release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets="$(gh release view "$tag" --json assets --jq '[.assets[].name] | join(" ")')"
          echo "Assets attached to $tag: $assets"
          case "${{ matrix.target }}" in
            *windows*)
              if ! echo "$assets" | grep -q -- '-setup.exe'; then
                echo "::error::Release $tag has no Windows NSIS installer attached"
                exit 1
              fi
              if ! echo "$assets" | grep -q -- '_full_x64-setup.exe'; then
                echo "::error::Release $tag has no full (offline-STT) Windows installer attached"
                exit 1
              fi
              ;;
            *linux*)
              if ! echo "$assets" | grep -qE '\.(deb|rpm|AppImage)'; then
                echo "::error::Release $tag has no Linux installer attached"
                exit 1
              fi
              ;;
          esac
