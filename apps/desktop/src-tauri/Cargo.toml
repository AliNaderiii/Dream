[package]
name = "dream-desktop"
version = "0.4.3"
description = "Dream — a personal AI assistant with first-class Persian support"
authors = ["Ali Naderi"]
license = "MIT"
repository = "https://github.com/AliNaderiii/Dream"
edition = "2021"
rust-version = "1.77.2"

# The library is what mobile targets link against; `main.rs` is a thin desktop wrapper.
[lib]
name = "dream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
log = "0.4"

# Desktop-only plugins. Mobile targets do not build these.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[features]
# Used by `tauri build --features custom-protocol`; kept for CLI compatibility.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
